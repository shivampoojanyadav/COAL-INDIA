<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MineGov</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 400px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1f4e79;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #173a5c;
        }

        .error-message {
            margin-bottom: 20px;
            padding: 10px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h1>MineGov</h1>
        <p>Smart Governance and Compliance Platform</p>
    </div>

    {% if form.errors %}
        <div class="error-message">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>

            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>

            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-button">
            Login
        </button>

    </form>

</div>

</body>
</html>

services:
  - type: web
    name: coalizen
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_demo_users && python manage.py seed_demo_data"
    startCommand: "gunicorn MineGov.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "minegov.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://minegov.onrender.com"
      - key: ALLOW_DEMO_LOGIN
        value: "True"
